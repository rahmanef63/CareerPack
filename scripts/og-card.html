<!doctype html>
<!--
  Source for frontend/public/og/og-card.jpg — the link-preview card.

  It exists because the card it replaces (og-light.jpg) was a flat JPEG with no
  source in the repo, so when its mockup rows went stale ("2 May 2024", CV dates)
  nobody could fix them. Nothing here carries a date, a year, a metric, a version
  or a named person, so re-rendering is only ever needed when the BRAND or the
  PILLARS change — never because time passed. Keep it that way.

  RE-RENDER (from a shell on this VPS; ~15s, no sudo):

    cd /home/rahman/projects/CareerPack/scripts && python3 -m http.server 8899 &
    # os-browser's /navigate rejects file:// (scheme_not_allowed), hence the server.
    cd /home/rahman/projects/os-vps/os-browser
    set -a; . ./.env; set +a                       # OS_BROWSER_SECRET
    OS_BROWSER_WIDTH=1200 OS_BROWSER_HEIGHT=630 OS_BROWSER_PORT=4102 \
      OS_BROWSER_PROFILE=/tmp/og-render node server.mjs & sleep 4
    H="x-os-browser-secret: $OS_BROWSER_SECRET"
    curl -fsS -H "$H" -H 'content-type: application/json' \
      -d '{"url":"http://127.0.0.1:8899/og-card.html"}' http://127.0.0.1:4102/navigate
    sleep 3                                        # /navigate returns at domcontentloaded; webfonts land after
    curl -fsS -H "$H" 'http://127.0.0.1:4102/screenshot?type=jpeg&q=92' \
      -o /home/rahman/projects/CareerPack/frontend/public/og/og-card.jpg
    kill %1 %2

  A THROWAWAY browser instance, not the live one on :4002: /screenshot captures
  the viewport, the viewport is fixed at launch, and the live service is 1280x800
  (which would letterbox the card and is shared with the os-vps Browser app).
  OS_BROWSER_PROFILE must differ too — Chromium locks the persistent profile dir.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareerPack — OG card source (1200x630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two fonts app/layout.tsx preloads eagerly: Fraunces is `font-display`,
     i.e. the exact face the landing hero uses, so the card and the page a
     click later are set in the same type. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* --brand / --brand-to from shared/styles/index.css, converted out of oklch. */
    --brand: #3981f6;
    --brand-deep: #1d3fad;
    --ink: #ffffff;
    --ink-soft: rgba(226, 236, 255, 0.66);
    --panel: rgba(255, 255, 255, 0.06);
    --panel-edge: rgba(255, 255, 255, 0.11);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    display: flex;
    padding: 64px;
    gap: 44px;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 620px at 88% -12%, rgba(57, 129, 246, 0.30), transparent 62%),
      radial-gradient(700px 500px at -8% 108%, rgba(29, 63, 173, 0.26), transparent 60%),
      linear-gradient(150deg, #060b16 0%, #0a1226 52%, #05090f 100%);
  }

  /* Both columns are explicitly sized rather than fr-based: this file is
     authored blind (nobody can see the render while editing it), so every box
     has to resolve without depending on how its text happens to measure. */
  .left  { width: 520px; display: flex; flex-direction: column; justify-content: space-between; }
  .right { width: 508px; display: flex; flex-direction: column; gap: 14px; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .wordmark { font-size: 46px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; }
  .wordmark b { font-weight: 700; color: var(--brand); }

  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 800;
    font-size: 66px;
    line-height: 1.06;
    letter-spacing: -0.015em;
  }
  /* Hard-wrapped: the balance point of this headline is a design decision, and
     auto-wrap at 520px is a coin flip between "your" and "career" leading line 3. */
  h1 .accent { color: var(--brand); }

  .lede {
    margin: 28px 0 0;
    font-size: 26px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  .url { font-size: 26px; font-weight: 600; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.005em; }

  /* One row per pillar, `flex: 1` so the five of them divide the column height
     exactly — no arithmetic to redo if a row's copy changes. */
  .pillar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 22px;
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    background: var(--panel);
  }
  .tile {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
  }
  .tile svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pillar span { font-size: 27px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
</style>
</head>
