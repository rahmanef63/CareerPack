name: Deploy Cloudflare frontend

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_CONVEX_URL: https://savory-oyster-802.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://savory-oyster-802.convex.site
      NEXT_PUBLIC_SITE_URL: https://careerpack.org
      APP_URL: https://careerpack.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Verify active backend
        run: |
          curl --fail --silent --show-error --max-time 20 "$NEXT_PUBLIC_CONVEX_SITE_URL/api/health"
      - name: Build Worker
        run: pnpm build:cloudflare
      - name: Deploy Worker and populate cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm --filter careerpack-frontend exec opennextjs-cloudflare deploy
