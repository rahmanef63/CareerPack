name: Deploy Convex

on:
  workflow_dispatch:
concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex functions
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          test "$CONVEX_SELF_HOSTED_URL" = "https://api.careerpack.org"
          test -n "$CONVEX_SELF_HOSTED_ADMIN_KEY"
          grep -q '^ENV NEXT_PUBLIC_CONVEX_URL=https://api.careerpack.org$' Dockerfile
          pnpm exec convex deploy --yes
